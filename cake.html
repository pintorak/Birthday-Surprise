<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Cake</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  background: #C7DAD8;

  background-image:
    radial-gradient(#F0EEF3 3px, transparent 3px);

  background-size: 28px 28px;

  font-family: Arial, sans-serif;
}

/* พื้นที่เค้ก */

.cake-scene {
  position: relative;

  width: 500px;
  height: 520px;

  margin: auto;
}


/* =========================
   CAKE
========================= */

.cake {
  position: absolute;

  width: 360px;
  height: 250px;

  left: 50%;
  bottom: 80px;

  transform: translateX(-50%);
}


/* ชั้นล่าง */

.layer-bottom {
  position: absolute;

  left: 0;
  bottom: 0;

  width: 360px;
  height: 105px;

  background: #E9B77F;

  border: 4px solid #B97958;

  border-radius: 10px 10px 25px 25px;
}


/* ชั้นกลาง */

.layer-middle {
  position: absolute;

  left: 25px;
  bottom: 85px;

  width: 310px;
  height: 85px;

  background: #F0C99B;

  border: 4px solid #B97958;

  border-radius: 12px;
}


/* ชั้นบน */

.layer-top {
  position: absolute;

  left: 45px;
  bottom: 150px;

  width: 270px;
  height: 70px;

  background: #F5D8B5;

  border: 4px solid #B97958;

  border-radius: 50% 50% 15px 15px;
}


/* =========================
   ครีมด้านบน
========================= */

.frosting {
  position: absolute;

  left: 40px;
  bottom: 178px;

  width: 280px;
  height: 48px;

  background: #FFF8EF;

  border: 4px solid #D9A18F;

  border-radius: 50%;

  z-index: 5;
}


/* ครีมหยด */

.drip {
  position: absolute;

  bottom: -20px;

  width: 30px;
  height: 25px;

  background: #FFF8EF;

  border-left: 3px solid #D9A18F;
  border-right: 3px solid #D9A18F;
  border-bottom: 3px solid #D9A18F;

  border-radius: 0 0 15px 15px;
}

.drip:nth-child(1) {
  left: 25px;
}

.drip:nth-child(2) {
  left: 90px;
  height: 35px;
}

.drip:nth-child(3) {
  right: 90px;
}

.drip:nth-child(4) {
  right: 25px;
  height: 32px;
}


/* =========================
   สตรอว์เบอร์รี
========================= */

.strawberry {
  position: absolute;

  z-index: 8;

  width: 42px;
  height: 48px;

  background: #E94F5F;

  border-radius: 50% 50% 45% 45%;

  bottom: 190px;
}

.strawberry::before {
  content: "•  •  •";

  position: absolute;

  top: 18px;
  left: 7px;

  color: #FFE6A3;

  font-size: 9px;
  letter-spacing: 4px;
}

.strawberry::after {
  content: "🌿";

  position: absolute;

  top: -15px;
  left: 8px;

  font-size: 18px;
}

.s1 {
  left: 80px;
  transform: rotate(-10deg);
}

.s2 {
  left: 160px;
  bottom: 198px;
}

.s3 {
  right: 75px;
  transform: rotate(10deg);
}


/* =========================
   ชื่อบนเค้ก
========================= */

.name {
  position: absolute;

  z-index: 10;

  left: 50%;
  bottom: 62px;

  transform: translateX(-50%);

  width: 100%;

  text-align: center;

  font-family: cursive;

  font-size: 32px;

  font-weight: bold;

  color: #D65B79;

}


/* =========================
   เทียน
========================= */

.candles {
  position: absolute;

  z-index: 20;

  top: 70px;

  left: 50%;

  transform: translateX(-50%);

  display: flex;

  gap: 25px;

  align-items: flex-end;
}

.candle {
  position: relative;

  width: 24px;
  height: 72px;

  background:
    repeating-linear-gradient(
      135deg,
      #FFF4F3 0px,
      #FFF4F3 7px,
      #E95D80 7px,
      #E95D80 13px
    );

  border: 2px solid #C94D70;

  border-radius: 6px;

  cursor: pointer;
}


/* ไฟ */

.flame {
  position: absolute;

  width: 20px;
  height: 30px;

  left: 50%;
  top: -32px;

  transform: translateX(-50%);

  background: #FFD866;

  border-radius: 50% 50% 45% 45%;

  box-shadow:
    0 0 12px #FFD866;

  animation: flicker 0.7s infinite alternate;
}

@keyframes flicker {

  from {
    transform: translateX(-50%) scale(1);
  }

  to {
    transform: translateX(-50%) scale(1.12);
  }

}

.candle.off {
  opacity: 0.35;
}

.candle.off .flame {
  display: none;
}


/* =========================
   จาน
========================= */

.plate {
  position: absolute;

  left: 50%;
  bottom: 55px;

  transform: translateX(-50%);

  width: 410px;
  height: 28px;

  background: #FFF8EF;

  border: 4px solid #C98D7B;

  border-radius: 50%;
}

</style>
</head>


<body>

<div class="cake-scene">

  <!-- เทียน -->

  <div class="candles">

    <div class="candle" onclick="blow(this)">
      <div class="flame"></div>
    </div>

    <div class="candle" onclick="blow(this)">
      <div class="flame"></div>
    </div>

    <div class="candle" onclick="blow(this)">
      <div class="flame"></div>
    </div>

    <div class="candle" onclick="blow(this)">
      <div class="flame"></div>
    </div>

    <div class="candle" onclick="blow(this)">
      <div class="flame"></div>
    </div>

  </div>


  <!-- เค้ก -->

  <div class="cake">

    <div class="layer-bottom"></div>

    <div class="layer-middle"></div>

    <div class="layer-top"></div>

    <div class="frosting">

      <div class="drip"></div>
      <div class="drip"></div>
      <div class="drip"></div>
      <div class="drip"></div>

    </div>


    <!-- สตรอว์เบอร์รี -->

    <div class="strawberry s1"></div>
    <div class="strawberry s2"></div>
    <div class="strawberry s3"></div>


    <!-- ชื่อ -->

    <div class="name">
      SEOLHO ♡
    </div>

  </div>


  <!-- จาน -->

  <div class="plate"></div>

</div>


<script>

function blow(candle) {
  candle.classList.toggle("off");
}

</script>

</body>
</html>
