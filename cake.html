<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Your Birthday Cake ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px 15px;

      background-color: #C7DAD8;

      background-image:
        radial-gradient(#F0EEF3 3px, transparent 3px),
        radial-gradient(#F0EEF3 3px, transparent 3px);

      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;

      font-family: "Kanit", sans-serif;
      color: #6f5360;
    }

    .container {
      width: 100%;
      max-width: 700px;

      background: rgba(240, 238, 243, 0.94);

      border: 3px solid #CD5782;
      border-radius: 30px;

      padding: 35px 20px 45px;

      text-align: center;

      box-shadow:
        0 15px 35px rgba(90, 50, 70, 0.15);
    }

    h1 {
      margin: 0 0 8px;

      font-family: "Playfair Display", serif;
      color: #CD5782;

      font-size: clamp(30px, 7vw, 46px);
    }

    .subtitle {
      margin: 0 0 30px;

      font-family: "Itim", cursive;
      font-size: 21px;
      color: #856472;
    }

    /* CAKE AREA */

    .cake-area {
      position: relative;

      width: 100%;
      max-width: 480px;

      height: 400px;

      margin: 0 auto 20px;

      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* CANDLES */

    .candles {
      position: absolute;

      top: 35px;

      left: 50%;

      transform: translateX(-50%);

      display: flex;
      justify-content: center;
      align-items: flex-end;

      gap: 20px;

      z-index: 5;
    }

    .candle {
      position: relative;

      width: 28px;
      height: 85px;

      border-radius: 8px 8px 4px 4px;

      background:
        repeating-linear-gradient(
          135deg,
          #F0EEF3 0px,
          #F0EEF3 8px,
          #CD5782 8px,
          #CD5782 15px
        );

      border: 2px solid #b94c73;

      cursor: pointer;

      transition: 0.2s;
    }

    .candle:hover {
      transform: translateY(-5px);
    }

    .candle.off {
      opacity: 0.45;
    }

    /* FLAME */

    .flame {
      position: absolute;

      width: 23px;
      height: 35px;

      left: 50%;
      top: -38px;

      transform: translateX(-50%);

      background: #DCD3AA;

      border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;

      box-shadow:
        0 0 12px #DCD3AA,
        0 0 25px rgba(220, 211, 170, 0.8);

      animation: flicker 0.8s infinite alternate;
    }

    .flame::after {
      content: "";

      position: absolute;

      width: 10px;
      height: 18px;

      left: 50%;
      bottom: 3px;

      transform: translateX(-50%);

      background: #CD5782;

      border-radius: 50%;
    }

    .candle.off .flame {
      display: none;
    }

    @keyframes flicker {
      from {
        transform: translateX(-50%) scale(1);
      }

      to {
        transform: translateX(-50%) scale(1.12);
      }
    }

    /* CAKE */

    .cake {
      position: absolute;

      bottom: 30px;

      width: 370px;
      max-width: 90vw;

      height: 190px;

      z-index: 2;
    }

    /* TOP */

    .cake-top {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 75px;

      background:
        radial-gradient(
          ellipse at center,
          #F0EEF3 0%,
          #F0EEF3 65%,
          #e6dfe5 100%
        );

      border: 4px solid #CD5782;

      border-radius: 50%;

      z-index: 3;

      box-shadow:
        inset 0 -10px 0 rgba(205, 87, 130, 0.08);
    }

    /* CAKE BODY */

    .cake-body {
      position: absolute;

      top: 35px;
      left: 5px;

      width: calc(100% - 10px);
      height: 125px;

      background:
        linear-gradient(
          to bottom,
          #DCD3AA 0%,
          #DCD3AA 50%,
          #e4dcc0 50%,
          #e4dcc0 100%
        );

      border: 4px solid #CD5782;

      border-top: none;

      border-radius: 0 0 30px 30px;

      z-index: 2;

      box-shadow:
        inset 0 -12px 0 rgba(205, 87, 130, 0.12);
    }

    /* ICING DRIPS */

    .icing {
      position: absolute;

      top: 42px;
      left: 0;

      width: 100%;
      height: 45px;

      z-index: 4;
    }

    .drip {
      position: absolute;

      top: 0;

      width: 50px;
      height: 35px;

      background: #F0EEF3;

      border: 3px solid #CD5782;

      border-top: none;

      border-radius: 0 0 30px 30px;
    }

    .drip:nth-child(1) {
      left: 25px;
      height: 30px;
    }

    .drip:nth-child(2) {
      left: 90px;
      height: 43px;
    }

    .drip:nth-child(3) {
      left: 160px;
      height: 28px;
    }

    .drip:nth-child(4) {
      right: 90px;
      height: 42px;
    }

    .drip:nth-child(5) {
      right: 25px;
      height: 31px;
    }

    /* DECORATION */

    .sprinkles {
      position: absolute;

      top: 18px;
      left: 50%;

      transform: translateX(-50%);

      width: 250px;

      display: flex;
      justify-content: space-around;

      font-size: 20px;

      z-index: 5;
    }

    .sprinkles span:nth-child(1) {
      transform: rotate(-20deg);
    }

    .sprinkles span:nth-child(2) {
      transform: rotate(20deg);
    }

    .sprinkles span:nth-child(3) {
      transform: rotate(-10deg);
    }

    .sprinkles span:nth-child(4) {
      transform: rotate(15deg);
    }

    .sprinkles span:nth-child(5) {
      transform: rotate(-25deg);
    }

    /* NAME */

    .name {
      position: absolute;

      top: 80px;
      left: 50%;

      transform: translateX(-50%);

      width: 100%;

      z-index: 5;

      font-family: "Itim", cursive;

      font-size: clamp(25px, 6vw, 38px);

      color: #CD5782;

      text-shadow:
        1px 1px 0 #F0EEF3,
        -1px -1px 0 #F0EEF3,
        1px -1px 0 #F0EEF3,
        -1px 1px 0 #F0EEF3;
    }

    /* PLATE */

    .plate {
      position: absolute;

      bottom: 15px;
      left: 50%;

      transform: translateX(-50%);

      width: 430px;
      max-width: 95vw;

      height: 28px;

      background: #F0EEF3;

      border: 4px solid #CD5782;

      border-radius: 50%;

      z-index: 1;

      box-shadow:
        0 8px 0 rgba(205, 87, 130, 0.12);
    }

    .instruction {
      font-family: "Itim", cursive;

      font-size: 20px;

      color: #856472;

      margin: 0 0 18px;
    }

    /* SECRET */

    .secret {
      display: none;

      margin: 20px auto 0;

      max-width: 500px;

      padding: 25px 20px;

      background: #F0EEF3;

      border: 2px solid #CD5782;

      border-radius: 25px;

      animation: appear 0.7s ease;
    }

    .secret.show {
      display: block;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .secret h2 {
      margin: 0 0 10px;

      font-family: "Playfair Display", serif;

      color: #CD5782;

      font-size: 30px;
    }

    .secret p {
      font-family: "Itim", cursive;

      font-size: 20px;

      line-height: 1.8;

      margin: 0 0 20px;
    }

    .next-btn {
      display: inline-block;

      text-decoration: none;

      background: #CD5782;

      color: white;

      padding: 12px 25px;

      border-radius: 999px;

      font-family: "Itim", cursive;

      font-size: 18px;

      box-shadow: 0 5px 0 #a94467;

      transition: 0.2s;
    }

    .next-btn:hover {
      transform: translateY(-2px);

      box-shadow: 0 7px 0 #a94467;
    }

    .next-btn:active {
      transform: translateY(3px);

      box-shadow: 0 2px 0 #a94467;
    }

    @media (max-width: 600px) {

      .container {
        padding: 28px 10px 35px;
      }

      .cake-area {
        height: 350px;
      }

      .cake {
        width: 320px;
        height: 175px;
      }

      .candles {
        gap: 12px;
      }

      .candle {
        width: 24px;
        height: 72px;
      }

      .plate {
        width: 360px;
      }

      .drip:nth-child(1) {
        left: 18px;
      }

      .drip:nth-child(2) {
        left: 70px;
      }

      .drip:nth-child(3) {
        left: 135px;
      }

      .drip:nth-child(4) {
        right: 70px;
      }

      .drip:nth-child(5) {
        right: 18px;
      }

      .name {
        top: 76px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Your Birthday Cake ♡</h1>

    <p class="subtitle">
      Make a wish, Seolho ♡
    </p>

    <div class="cake-area">

      <!-- CANDLES -->
      <div class="candles">

        <div class="candle" onclick="blowCandle(this)">
          <div class="flame"></div>
        </div>

        <div class="candle" onclick="blowCandle(this)">
          <div class="flame"></div>
        </div>

        <div class="candle" onclick="blowCandle(this)">
          <div class="flame"></div>
        </div>

        <div class="candle" onclick="blowCandle(this)">
          <div class="flame"></div>
        </div>

        <div class="candle" onclick="blowCandle(this)">
          <div class="flame"></div>
        </div>

      </div>

      <!-- CAKE -->
      <div class="cake">

        <div class="cake-top"></div>

        <div class="cake-body"></div>

        <div class="icing">
          <div class="drip"></div>
          <div class="drip"></div>
          <div class="drip"></div>
          <div class="drip"></div>
          <div class="drip"></div>
        </div>

        <div class="sprinkles">
          <span>♡</span>
          <span>✦</span>
          <span>♡</span>
          <span>✦</span>
          <span>♡</span>
        </div>

        <div class="name">
          SEOLHO ♡
        </div>

      </div>

      <!-- PLATE -->
      <div class="plate"></div>

    </div>

    <p class="instruction" id="instruction">
      Click each candle to blow it out ♡
    </p>

    <!-- SECRET MESSAGE -->
    <div class="secret" id="secret">

      <h2>Wish granted ♡</h2>

      <p>
        ขอให้คำอธิษฐานของเธอเป็นจริง<br>
        ขอให้ปีนี้มีแต่เรื่องดี ๆ เข้ามา<br>
        และขอให้มีความสุขมาก ๆ ในทุกวันนะ ♡
      </p>

      <a href="letter.html" class="next-btn">
        There's a letter for you →
      </a>

    </div>

  </div>

  <script>

    let candlesLeft = 5;

    function blowCandle(candle) {

      if (candle.classList.contains("off")) {
        return;
      }

      candle.classList.add("off");

      candlesLeft--;

      if (candlesLeft === 0) {

        document.getElementById("instruction").textContent =
          "✨ All your candles are gone... ✨";

        document.getElementById("secret").classList.add("show");

      } else {

        document.getElementById("instruction").textContent =
          candlesLeft + " candle" +
          (candlesLeft > 1 ? "s" : "") +
          " left... make a wish ♡";

      }

    }

  </script>

</body>
</html>
