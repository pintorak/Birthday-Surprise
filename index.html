<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;500&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      font-family: "Kanit", sans-serif;
      color: #5d4b52;

      background-color: #f0eef3;

      background-image:
        radial-gradient(#cd5782 1.5px, transparent 1.5px),
        radial-gradient(#c7dad8 1.5px, transparent 1.5px);

      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;

      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .small {
      font-family: "Itim", cursive;
      font-size: 21px;
      color: #8b747d;
      margin-bottom: 10px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 52px;
      color: #cd5782;
      margin-bottom: 10px;
    }

    .subtitle {
      font-family: "Itim", cursive;
      font-size: 24px;
      color: #76666c;
      margin-bottom: 35px;
    }

    .gift {
      width: 210px;
      height: 180px;
      margin: 0 auto 35px;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .gift:hover {
      transform: translateY(-8px);
    }

    .box {
      position: absolute;
      left: 10px;
      bottom: 0;

      width: 190px;
      height: 125px;

      background: #cd5782;
      border-radius: 8px;

      box-shadow:
        0 18px 35px rgba(90, 60, 70, 0.2);
    }

    .box::before {
      content: "";

      position: absolute;
      left: 50%;
      top: 0;

      transform: translateX(-50%);

      width: 30px;
      height: 100%;

      background: #dcd3aa;
    }

    .box::after {
      content: "";

      position: absolute;
      left: 0;
      top: 25px;

      width: 100%;
      height: 30px;

      background: #dcd3aa;
    }

    .lid {
      position: absolute;

      left: 0;
      top: 30px;

      width: 210px;
      height: 35px;

      background: #cd5782;
      border-radius: 7px;

      z-index: 3;

      transition:
        top 0.7s ease,
        transform 0.7s ease;
    }

    .lid::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 0;

      transform: translateX(-50%);

      width: 30px;
      height: 100%;

      background: #dcd3aa;
    }

    .ribbon {
      position: absolute;

      width: 70px;
      height: 35px;

      left: 50%;
      top: 0;

      transform: translateX(-50%);

      z-index: 5;
    }

    .ribbon::before,
    .ribbon::after {
      content: "";

      position: absolute;

      width: 38px;
      height: 27px;

      border: 6px solid #dcd3aa;
      border-radius: 50%;
    }

    .ribbon::before {
      left: 0;
      transform: rotate(25deg);
    }

    .ribbon::after {
      right: 0;
      transform: rotate(-25deg);
    }

    .gift.open .lid {
      top: -50px;
      transform: rotate(-8deg);
    }

    .message {
      opacity: 0;

      transform: translateY(20px);

      transition:
        opacity 0.6s ease,
        transform 0.6s ease;
    }

    .message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .message-title {
      font-family: "Itim", cursive;
      font-size: 28px;
      color: #cd5782;
      margin-bottom: 8px;
    }

    .message-text {
      font-size: 16px;
      line-height: 1.9;
      margin-bottom: 20px;
    }

    .next-button {
      display: inline-block;

      text-decoration: none;

      color: white;

      background: #cd5782;

      padding: 11px 24px;

      border-radius: 999px;

      font-family: "Itim", cursive;

      font-size: 18px;

      box-shadow:
        0 8px 20px rgba(205, 87, 130, 0.25);
    }

    .hint {
      font-family: "Itim", cursive;
      color: #9a858d;
      font-size: 17px;
      margin-top: 15px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }

      .subtitle {
        font-size: 21px;
      }

      .gift {
        transform: scale(0.9);
      }

      .gift:hover {
        transform: scale(0.9) translateY(-5px);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="small">
      A little surprise for you ♡
    </div>

    <h1>
      Happy Birthday
    </h1>

    <div class="subtitle">
      My favorite person ♡
    </div>

    <div
      class="gift"
      id="gift"
      onclick="openGift()"
    >

      <div class="lid"></div>

      <div class="ribbon"></div>

      <div class="box"></div>

    </div>

    <div
      class="message"
      id="message"
    >

      <div class="message-title">
        Happy Birthday, my love ♡
      </div>

      <div class="message-text">
        ของขวัญยังไม่หมดแค่นี้นะ...<br>
        ยังมีอะไรอีกหลายอย่างรอให้เธอเปิดอยู่ 🎁
      </div>

      <a
        href="birthday.html"
        class="next-button"
      >
        เปิดของขวัญต่อ ♡
      </a>

    </div>

    <div class="hint">
      แตะที่กล่องของขวัญเพื่อเปิด 🎀
    </div>

  </div>

  <script>
    function openGift() {
      document.getElementById("gift").classList.add("open");
      document.getElementById("message").classList.add("show");
    }
  </script>

</body>
</html>
