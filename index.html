<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Birthday Surprise ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background-color: #C7DAD8;

      background-image:
        radial-gradient(#F0EEF3 3px, transparent 3px);

      background-size: 28px 28px;

      font-family: 'Kanit', sans-serif;
      color: #5b4050;

      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
    }

    /* กล่องพื้นหลังข้อความ */
    .message-box {
      background: rgba(240, 238, 243, 0.94);
      border: 3px solid #CD5782;
      border-radius: 30px;

      padding: 35px 25px 32px;

      box-shadow:
        0 12px 30px rgba(91, 64, 80, 0.15);

      backdrop-filter: blur(4px);
    }

    .small-title {
      font-family: 'Itim', cursive;
      font-size: 22px;
      color: #CD5782;
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(30px, 8vw, 52px);
      color: #CD5782;
      margin-bottom: 10px;
    }

    .subtitle {
      font-family: 'Itim', cursive;
      font-size: 21px;
      color: #6b5260;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* กล่องของขวัญ */
    .gift-area {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 5px 0 25px;
    }

    .gift {
      position: relative;
      width: 150px;
      height: 120px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .gift:hover {
      transform: translateY(-6px);
    }

    .gift-box {
      position: absolute;
      bottom: 0;
      left: 10px;

      width: 130px;
      height: 85px;

      background: #CD5782;
      border-radius: 8px;

      box-shadow:
        0 10px 20px rgba(91, 64, 80, 0.2);
    }

    .gift-box::before {
      content: "";
      position: absolute;
      left: 55px;
      top: 0;

      width: 20px;
      height: 85px;

      background: #DCD3AA;
    }

    .gift-lid {
      position: absolute;
      top: 20px;
      left: 5px;

      width: 140px;
      height: 25px;

      background: #CD5782;
      border-radius: 7px;

      z-index: 3;

      transition:
        transform 0.7s ease,
        top 0.7s ease;
    }

    .gift-lid::before {
      content: "";
      position: absolute;
      left: 60px;
      top: 0;

      width: 20px;
      height: 25px;

      background: #DCD3AA;
    }

    .ribbon {
      position: absolute;
      z-index: 4;
      left: 51px;
      top: 2px;

      width: 38px;
      height: 35px;
    }

    .ribbon::before,
    .ribbon::after {
      content: "";
      position: absolute;

      width: 28px;
      height: 18px;

      background: #DCD3AA;
      border-radius: 50% 50% 10% 50%;
    }

    .ribbon::before {
      left: -18px;
      transform: rotate(-30deg);
    }

    .ribbon::after {
      right: -18px;
      transform: rotate(30deg);
    }

    .gift.open .gift-lid {
      transform: rotate(-12deg) translate(-8px, -30px);
    }

    .gift.open {
      animation: bounce 0.7s ease;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .click-text {
      font-family: 'Itim', cursive;
      font-size: 18px;
      color: #CD5782;
      margin-bottom: 10px;
    }

    .surprise-message {
      display: none;
      margin-top: 20px;
      animation: fadeIn 0.8s ease;
    }

    .surprise-message.show {
      display: block;
    }

    .surprise-message p {
      font-family: 'Itim', cursive;
      font-size: 24px;
      color: #CD5782;
      margin-bottom: 18px;
    }

    .next-button {
      display: inline-block;

      padding: 12px 28px;

      background: #CD5782;
      color: white;

      text-decoration: none;

      border-radius: 999px;

      font-family: 'Kanit', sans-serif;
      font-size: 16px;

      box-shadow:
        0 7px 15px rgba(205, 87, 130, 0.3);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .next-button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 10px 20px rgba(205, 87, 130, 0.35);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .message-box {
        padding: 28px 18px 25px;
      }

      .small-title {
        font-size: 19px;
      }

      .subtitle {
        font-size: 19px;
      }

      .gift {
        transform: scale(0.9);
      }

      .gift:hover {
        transform: scale(0.9) translateY(-6px);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="message-box">

      <div class="small-title">
        A little surprise for you ♡
      </div>

      <h1>
        Happy Birthday
      </h1>

      <div class="subtitle">
        I made something special<br>
        just for you...
      </div>

      <div class="gift-area">

        <div class="gift" id="gift">

          <div class="ribbon"></div>

          <div class="gift-lid"></div>

          <div class="gift-box"></div>

        </div>

      </div>

      <div class="click-text">
        ♡ Click the gift ♡
      </div>

      <div class="surprise-message" id="message">

        <p>
          Happy Birthday, my love ♡
        </p>

        <a href="birthday.html" class="next-button">
          Open your surprise →
        </a>

      </div>

    </div>

  </div>

  <script>
    const gift = document.getElementById("gift");
    const message = document.getElementById("message");

    gift.addEventListener("click", function () {
      gift.classList.add("open");

      setTimeout(function () {
        message.classList.add("show");
      }, 600);
    });
  </script>

</body>
</html>
